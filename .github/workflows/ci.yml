name: CI

on:
  push:
    branches: [master, main]
  pull_request:

jobs:
  verify:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        # Node 18 is EOL but still a supported floor; pin its exact final patch since only 18.20+
        # exposes global Web Crypto and fetch without a flag.
        node: ["18.20.5", "20", "22", "24", "26"]
    name: Node ${{ matrix.node }}
    steps:
      - uses: actions/checkout@v4

      - name: Set up Node ${{ matrix.node }}
        uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node }}
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Typecheck, test (node + workerd + edge-runtime), and package checks
        run: npm run check
