name: CI

on:
  push:
    branches: [master, main]
  pull_request:

jobs:
  # typecheck, the workerd/edge-runtime suites, and package hygiene checks don't depend on which Node version
  # hosts the process: the workerd/edge-runtime suites run inside simulated runtimes (miniflare / @edge-runtime/vm)
  # regardless of host Node, and some of that tooling (miniflare's undici, @arethetypeswrong/cli) itself requires
  # Node >=20 to run at all. Only the plain Node-environment tests below genuinely vary by host Node version.
  checks:
    runs-on: ubuntu-latest
    name: Typecheck, workerd/edge suites, package checks
    steps:
      - uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm

      - name: Install dependencies
        run: npm ci

      - run: npm run typecheck
      - run: npm run test:workers
      - run: npm run test:edge
      - run: npm run check:package

  test-node:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        # Node 18 is EOL but still a supported floor; pin its exact final patch since only 18.20+
        # exposes global Web Crypto and fetch without a flag.
        node: ["18.20.5", "20", "22", "24", "26"]
    name: Node ${{ matrix.node }}
    steps:
      - uses: actions/checkout@v4

      - name: Set up Node ${{ matrix.node }}
        uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node }}
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Test (node)
        run: npm run test:node
